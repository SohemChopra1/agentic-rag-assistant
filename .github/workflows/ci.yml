name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Without this, test_search.py / test_embed.py / test_load.py (14 tests)
    # silently skip in CI — pytest would still report green with 14 of them
    # never actually running, and nobody would notice from the checkmark
    # alone. This service gives them a real Postgres+pgvector to
    # run against, matching docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic_rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.16.8

      # rule set pinned in backend/ruff.toml
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      # eval/ scoring rules: pure functions, no API keys or running stack
      - name: Lint and test eval harness
        run: |
          ruff check --config ruff.toml ../eval
          pytest -v ../eval

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend-image:
    runs-on: ubuntu-latest
    # build the same image docker compose runs, so a broken Dockerfile or
    # an uninstallable pin fails here instead of on someone's machine
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t agentic-rag-backend ./backend
